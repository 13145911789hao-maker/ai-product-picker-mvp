name: HermitCreate Product Picker

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 09:00 自动运行（UTC 01:00）
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  run-picker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run HermitCreate picker
        run: python main.py

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermitcreate-output
          path: output.json

      - name: Commit output.json back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output.json
          git diff --cached --quiet || git commit -m "update picker output"
          git push
